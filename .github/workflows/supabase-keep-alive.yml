name: Supabase 6-Day Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 6th day at 03:00 UTC (well within Supabase's 7-day inactivity pause window)
    - cron: '0 3 */6 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Endpoint
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://tesla-club.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Executing scheduled 6th-day Supabase heartbeat ping..."
          
          # Ping the API endpoint with secret authorization
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$SITE_URL/api/cron/keep-alive?source=github_action" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase cluster pinged successfully. Auto-pause prevented."
            exit 0
          else
            echo "⚠️ Non-200 response received ($HTTP_STATUS). Inspecting payload..."
            # Allow graceful exit so transient DNS won't mark workflow failed
            exit 0
          fi
